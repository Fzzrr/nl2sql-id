[project]
name = "nl2sql-id"
version = "0.1.0"
description = "Indonesian text-to-SQL agent over a synthetic payments database"
requires-python = ">=3.11"
dependencies = [
    "mlflow>=3.17.2",
    "numpy>=2.4.6",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlglot>=30.24.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
